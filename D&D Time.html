<!DOCTYPE HTML>

<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      p {
        text-align: center;
        font-size: 40px;
        margin-top: 50%;
        font-weight: bold;
      }
    </style>
  </head>

  <body bgcolor="#e4bf8a" text="#DF0000">
    <p id="demo"></p>

    <script>
      var countDownDate = new Date("Nov 15, 2025 16:00:00").getTime();

      var x = setInterval(function() {
        var now = new Date().getTime();
        var distance = countDownDate - now;

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("demo").innerHTML = days + "d\n" + hours + ":"
  + minutes + ":" + seconds;

        if (distance < 0) {
          clearInterval(x);
          document.getElementById("demo").innerHTML = "I CAST\nSUMMON PLAYER!!!";
        }
      }, 1000);
    </script>
  </body>
</html>
